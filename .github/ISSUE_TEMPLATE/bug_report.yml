name: "Bug Report"
description: "File a bug report for the Stellar Music frontend web application"
title: "[UI Bug]: "
labels: ["bug", "frontend", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting an issue with the Stellar Music frontend!"
  - type: input
    id: browser
    attributes:
      label: "Browser & Wallet Environment"
      description: "E.g. Chrome 128 + Freighter v3.0, Brave, Edge"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear description of the bug or unexpected playback behavior."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the problem."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
